<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumah Betang</title>
    <style>
        /* Matikan scrollbar pada window luar iframe */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Mencegah scrollbar ganda dari body */
            background-color: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Kartu utama yang memegang scrollbar tunggal */
        .gallery-container {
            max-width: 400px;
            height: 100vh;
            /* Mengisi penuh tinggi iframe Lapentor */
            box-sizing: border-box;
            margin: 0 auto;
            text-align: center;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            /* Memunculkan HANYA SATU scrollbar internal jika teks panjang */
        }

        .slide-title {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .image-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            width: 100%;
            max-width: 356px;
            border-radius: 8px;
            object-fit: cover;
            transition: opacity 0.3s ease-in-out;
        }

        .btn-nav {
            position: absolute;
            background-color: rgba(211, 84, 0, 0.85);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
            z-index: 10;
        }

        .btn-nav:hover {
            background-color: rgba(160, 64, 0, 1);
        }

        .prev {
            left: 5px;
        }

        .next {
            right: 5px;
        }

        .slide-desc {
            font-size: 0.9rem;
            color: #666;
            margin-top: 15px;
            line-height: 1.5;
            text-align: justify;
        }
    </style>
</head>

<body>

    <div class="gallery-container">
        <!-- Judul akan berubah otomatis -->
        <div class="slide-title" id="judul-hewan">Memuat...</div>

        <div class="image-wrapper">
            <!-- Tombol Before / Prev -->
            <button class="btn-nav prev" id="btn-prev" onclick="gantiSlide(-1)">&#10094;</button>

            <!-- Gambar utama -->
            <img id="gambar-hewan" src="" alt="Koleksi Museum">

            <!-- Tombol Next -->
            <button class="btn-nav next" id="btn-next" onclick="gantiSlide(1)">&#10095;</button>
        </div>

        <!-- Keterangan akan berubah otomatis -->
        <div class="slide-desc" id="keterangan-hewan">Memuat keterangan...</div>
    </div>

    <script>

            },
            {
                judul: "Rumah Betang",
                gambar: "3.jpg",
                keterangan: "Rumah Betang merupakan bangunan dengan garis-garis geometris sederhana dan lugas dengan bangunan berbentuk barisan kolom-kolom berjajar menggunakan pola grid yang teratur dan terarah dengan struktur bangunan tinggi. Konstruksi bangunan Rumah Betang menggunakan struktur rangka kayu. Dinding dan lantainya dibuat dari papan yang disusun rapat. Namun, lantai teras (Pante) dibuat dari kayu bulat yang disusun agak jarang. Atap Rumah Betang dibuat dari sirap dan ada juga dari daun rumbia dan seng. Atap rumah ini berbentuk pelana berpola linear simetris. Rumah betang terdiri dari beberapa bagian ruangan, yakni: Teras (Pante), Serambi (Sami), Ruang Inti (Bilik), dan Ruang Dapur."

            },
            {
                judul: "Rumah Betang",

            },
            {
                judul: "Rumah Betang",
                gambar: "6.jpg",
                keterangan: "Rumah Betang merupakan bangunan dengan garis-garis geometris sederhana dan lugas dengan bangunan berbentuk barisan kolom-kolom berjajar menggunakan pola grid yang teratur dan terarah dengan struktur bangunan tinggi. Konstruksi bangunan Rumah Betang menggunakan struktur rangka kayu. Dinding dan lantainya dibuat dari papan yang disusun rapat. Namun, lantai teras (Pante) dibuat dari kayu bulat yang disusun agak jarang. Atap Rumah Betang dibuat dari sirap dan ada juga dari daun rumbia dan seng. Atap rumah ini berbentuk pelana berpola linear simetris. Rumah betang terdiri dari beberapa bagian ruangan, yakni: Teras (Pante), Serambi (Sami), Ruang Inti (Bilik), dan Ruang Dapur."
            }
        ];

        let indexSekarang = 0;

        // Ambil elemen HTML yang akan dimanipulasi
        const elemenJudul = document.getElementById('judul-hewan');
        const elemenGambar = document.getElementById('gambar-hewan');
        const elemenKeterangan = document.getElementById('keterangan-hewan');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function updateTampilan() {
            // Ganti konten sesuai data array
            elemenJudul.innerText = koleksiData[indexSekarang].judul;
            elemenGambar.src = koleksiData[indexSekarang].gambar;
            elemenKeterangan.innerText = koleksiData[indexSekarang].keterangan;

            // Logika sesuai revisi dosen:
            // Sembunyikan tombol Prev jika sedang di gambar urutan pertama (index 0)
            if (indexSekarang === 0) {
                btnPrev.style.display = 'none';
            } else {
                btnPrev.style.display = 'flex';
            }

            // Sembunyikan tombol Next jika sedang di gambar urutan terakhir
            if (indexSekarang === koleksiData.length - 1) {
                btnNext.style.display = 'none';
            } else {
                btnNext.style.display = 'flex';
            }
        }

        function gantiSlide(arah) {
            indexSekarang += arah;
            updateTampilan();
        }

        // Jalankan fungsi saat web pertama kali dirender
        updateTampilan();
    </script>

</body>
</html>
